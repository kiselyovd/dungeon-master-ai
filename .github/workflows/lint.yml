name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-linux-gui-deps

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # Single source of truth shared with the local pre-commit/pre-push hooks
      # (scripts/gates.sh). --ci-lint = cargo fmt --check + clippy + biome ci +
      # tsc + em-dash. The checks live in gates.sh, not inline, so CI and local
      # hooks can never drift (the cargo-fmt gap that slipped through M11).
      - name: Quality gates (lint)
        run: bash scripts/gates.sh --ci-lint
