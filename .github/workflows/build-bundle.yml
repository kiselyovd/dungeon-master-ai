name: build-bundle

# Verify native cloud bundles and startup credential storage on all supported targets.
# Embedded model/media binaries remain in separate workflows. See docs/RELEASE.md.

on:
  pull_request:
  push:
    branches: [main, m4-local-mode-and-packaging]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: macos-14, target: aarch64-apple-darwin }
          # darwin-x86_64 dropped - macos-13 free runners queue indefinitely.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Em-dash check
        run: bash scripts/check-no-em-dash.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: desktop-${{ matrix.target }}
          cache-on-failure: true

      - name: Linux GUI deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install bun deps
        run: bun install --frozen-lockfile

      - name: Build cloud-only Tauri bundle
        env:
          DMAI_CLOUD_ONLY: '1'
        run: bun x tauri build --target ${{ matrix.target }} --config src-tauri/tauri.cloud.conf.json

      - name: Verify native profile and credential behavior
        shell: bash
        env:
          DMAI_CLOUD_ONLY: '1'
          # The bundle step already staged this exact backend; reuse it for lib tests.
          DMAI_SKIP_SIDECAR_BUILD: '1'
        run: |
          export TAURI_CONFIG="$(cat src-tauri/tauri.cloud.conf.json)"
          cargo test --locked --release --target ${{ matrix.target }} -p dungeon-master-ai --lib backend_profile
          cargo test --locked --release --target ${{ matrix.target }} -p dungeon-master-ai --lib backend_credentials

      - name: Verify actual OS credential store
        shell: bash
        env:
          DMAI_CLOUD_ONLY: '1'
          DMAI_SKIP_SIDECAR_BUILD: '1'
        run: |
          export TAURI_CONFIG="$(cat src-tauri/tauri.cloud.conf.json)"
          if [ "${{ matrix.os }}" = 'ubuntu-22.04' ]; then
            sudo apt-get update
            sudo apt-get install -y gnome-keyring dbus
            export XDG_DATA_HOME="$(mktemp -d "$RUNNER_TEMP/dmai-keyring.XXXXXX")"
            dbus-run-session -- bash -e <<'KEYRING_TEST'
          keyring_test_unlock=$(cat /proc/sys/kernel/random/uuid)
          printf '%s\n' "$keyring_test_unlock" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          unset keyring_test_unlock
          cargo test --locked --release --target ${{ matrix.target }} -p dungeon-master-ai --lib real_os_credential_store_round_trip -- --ignored
          KEYRING_TEST
          else
            cargo test --locked --release --target ${{ matrix.target }} -p dungeon-master-ai --lib real_os_credential_store_round_trip -- --ignored
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 7
