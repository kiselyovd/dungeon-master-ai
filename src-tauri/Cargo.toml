[package]
name = "dungeon-master-ai"
version = "0.13.0"
description = "Multimodal AI-powered D&D desktop application"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dungeon_master_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-dialog = "=2.8.3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
env_logger = "0.11"
app-application = { workspace = true }
axum.workspace = true
reqwest.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["UI_Notifications", "Win32_UI_Notifications", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage"] }
windows-core = "=0.100.0"
winreg = "=0.56.0"
