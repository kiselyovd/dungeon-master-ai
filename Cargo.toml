[workspace]
members = [
    "crates/adapter-llm",
    "crates/adapter-secrets",
    "crates/adapter-sqlite",
    "crates/app-application",
    "crates/app-domain",
    "crates/app-llm",
    "crates/app-server",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Daniil Kiselyov"]
license = "MIT OR Apache-2.0"
rust-version = "1.81"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
genai = "=0.6.5"
backon = "1"
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-native-tls", "macros", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
app-application = { path = "crates/app-application" }
adapter-llm = { path = "crates/adapter-llm" }
adapter-secrets = { path = "crates/adapter-secrets" }
adapter-sqlite = { path = "crates/adapter-sqlite" }
app-domain = { path = "crates/app-domain" }
iota_stronghold = "2"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
