[package]
name = "app-server"
version = "0.12.1"
autobins = false
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
adapter-http = { workspace = true }
adapter-llm = { workspace = true }
adapter-media = { workspace = true }
adapter-secrets = { workspace = true }
adapter-sqlite = { workspace = true }
app-application = { workspace = true }
app-llm = { path = "../app-llm" }
app-domain = { path = "../app-domain" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
dirs = "5"
futures = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
backon = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = "0.11"
base64 = "0.22"
urlencoding = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
app-server = { path = ".", features = ["test-support"] }
wiremock = "0.6"
tempfile = "3"

[features]
default = ["with-local-runtime"]
test-support = []
with-local-runtime = ["adapter-http/with-local-runtime"]
cloud-only = []
